name: PR Safety Check

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check

      - name: Check diff whitespace
        run: git diff --check origin/main...HEAD

      - name: Install browsers for dashboard regression tests
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium firefox webkit

      - name: Run tests (including latest main JSON in three browsers)
        env:
          CI_LATEST_MAIN_JSON: '1'
        run: python -m pytest tests/ -q -s
