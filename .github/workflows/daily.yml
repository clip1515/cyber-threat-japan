name: Daily Cyber Threat Japan Update

# 毎日1回、公開情報(JPCERT/CC・IPA・CISA・NVD・GitHub Security Advisories・
# 主要ベンダーTIブログ・国内セキュリティ報道)を収集し、DB更新・daily_report.md生成・
# GitHub Pages用ダッシュボードデータ生成までを行う。
#
# GitHub Actionsのランナーは(GitHub Cloud / Claude双方の実行環境と異なり)
# 一般的な外部サイトへのアウトバウンド通信が既定で許可されているため、
# ここでの定期収集はClaude自身のサンドボックス上で行うより確実に動作する。

on:
  schedule:
    # 07:00 JST = 22:00 UTC (前日)
    - cron: "17 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    # 公開と通知はmainからのみ(別ブランチからの手動実行でmainへpushしない)。
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collection pipeline (update.py)
        run: python update.py

      # JSONがDBの最新runと一致しない場合(JSON生成失敗・全ソース失敗)は非ゼロ終了し、
      # publishと通知を行わない。本文はファイルで渡し、シェルスクリプトへ式展開しない。
      - name: Build notification summary
        id: summary
        run: |
          python reporting/notify_summary.py > "$RUNNER_TEMP/notify_body.txt"
          cat "$RUNNER_TEMP/notify_body.txt"
          delimiter="EOF_$(python -c 'import uuid; print(uuid.uuid4().hex)')"
          {
            echo "body<<$delimiter"
            cat "$RUNNER_TEMP/notify_body.txt"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Commit and push updated data
        id: publish
        run: |
          git config user.name "cyber-threat-japan-bot"
          git config user.email "actions@users.noreply.github.com"
          bash scripts/publish_daily_data.sh
      # ---- 通知(任意・どちらもリポジトリのSecretsを設定した場合のみ有効化される) ----
      # publish成功を共通条件とし、ntfyとメールは互いの成否に関係なく実行する
      # (!cancelled() で既定の success() 条件を外す)。どちらかが失敗すればジョブは失敗として残る。

      - name: Notify via ntfy.sh (push notification)
        if: ${{ !cancelled() && steps.publish.outcome == 'success' && env.NTFY_TOPIC != '' }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NOTIFY_BODY_FILE: ${{ runner.temp }}/notify_body.txt
          NTFY_OUTCOME_FILE: ${{ runner.temp }}/ntfy_outcome.txt
        run: bash scripts/notify_ntfy.sh

      - name: Notify via email
        if: ${{ !cancelled() && steps.publish.outcome == 'success' && env.SMTP_USERNAME != '' }}
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER || 'smtp.gmail.com' }}
          server_port: ${{ secrets.SMTP_PORT || 465 }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: ${{ secrets.SMTP_USERNAME }}
          to: ${{ secrets.NOTIFY_EMAIL_TO }}
          subject: "cyber-threat-japan 日次レポート"
          body: ${{ steps.summary.outputs.body }}

      - name: Alert on workflow failure
        if: ${{ failure() }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        # ntfy自体の障害時はこのアラートも届かない(通知経路がntfyのみの場合)。
        # ntfyの日次通知が unknown(送信後に応答なし)の場合は、失敗ではなく結果不明として伝える。
        run: |
          if [ -n "$NTFY_TOPIC" ]; then
            ntfy_outcome=$(cat "$RUNNER_TEMP/ntfy_outcome.txt" 2>/dev/null || echo "not attempted")
            curl --fail --silent --show-error \
              --connect-timeout 10 --max-time 30 \
              -H "Title: cyber-threat-japan FAILURE" \
              -H "Priority: high" \
              -d "Daily workflow failed (daily ntfy summary: $ntfy_outcome). Check GitHub Actions: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              "https://ntfy.sh/$NTFY_TOPIC"
          fi
