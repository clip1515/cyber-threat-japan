# 情報源マスタ設定
# trust_level: 1=一次情報(公式機関/ベンダー) 2=大手報道 3=二次解説 4=SNS等
# type: rss | nvd_api | kev_json | github_advisory_api
#
# 追加方法: このリストに1エントリ追加するだけで update.py が自動的に収集対象に含める。
# type: rss の場合、feedparser がパース可能なRSS/AtomのURLを指定すればよい。

sources:
  # ---- 一次情報 (国内公的機関) ----
  - id: jpcert_alert
    name: "JPCERT/CC 注意喚起"
    type: rss
    url: "https://www.jpcert.or.jp/rss/jpcert.rdf"
    trust_level: 1
    lang: ja
    region: jp

  - id: jpcert_all
    name: "JPCERT/CC 全記事"
    type: rss
    url: "https://www.jpcert.or.jp/rss/jpcert-all.rdf"
    trust_level: 1
    lang: ja
    region: jp

  - id: ipa_security
    name: "IPA セキュリティセンター"
    type: rss
    url: "https://www.ipa.go.jp/security/rss/ipa-topic.rdf"
    trust_level: 1
    lang: ja
    region: jp

  # ---- 一次情報 (海外公的機関) ----
  - id: cisa_advisories
    name: "CISA Cybersecurity Advisories"
    type: rss
    url: "https://www.cisa.gov/cybersecurity-advisories/all.xml"
    trust_level: 1
    lang: en
    region: us

  - id: cisa_kev
    name: "CISA Known Exploited Vulnerabilities Catalog"
    type: kev_json
    url: "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"
    trust_level: 1
    lang: en
    region: us

  - id: nvd_cve
    name: "NVD CVE API 2.0"
    type: nvd_api
    url: "https://services.nvd.nist.gov/rest/json/cves/2.0"
    trust_level: 1
    lang: en
    region: global

  - id: github_advisories
    name: "GitHub Security Advisories"
    type: github_advisory_api
    url: "https://api.github.com/advisories"
    trust_level: 1
    lang: en
    region: global

  - id: msrc_blog
    name: "Microsoft Security Response Center Blog"
    type: rss
    url: "https://msrc.microsoft.com/blog/feed"
    trust_level: 1
    lang: en
    region: global

  # ---- ベンダーTI (脅威インテリジェンス) ----
  - id: cisco_talos
    name: "Cisco Talos Blog"
    type: rss
    url: "https://blog.talosintelligence.com/rss/"
    trust_level: 2
    lang: en
    region: global

  - id: mandiant_blog
    name: "Google / Mandiant Threat Intelligence"
    type: rss
    url: "https://cloud.google.com/blog/topics/threat-intelligence/rss"
    trust_level: 2
    lang: en
    region: global

  - id: cloudflare_blog
    name: "Cloudflare Blog"
    type: rss
    url: "https://blog.cloudflare.com/rss/"
    trust_level: 2
    lang: en
    region: global

  - id: unit42
    name: "Palo Alto Networks Unit42"
    type: rss
    url: "https://unit42.paloaltonetworks.com/feed/"
    trust_level: 2
    lang: en
    region: global

  - id: crowdstrike_blog
    name: "CrowdStrike Blog"
    type: rss
    url: "https://www.crowdstrike.com/blog/feed/"
    trust_level: 2
    lang: en
    region: global

  - id: securelist
    name: "Kaspersky Securelist"
    type: rss
    url: "https://securelist.com/feed/"
    trust_level: 2
    lang: en
    region: global

  - id: welivesecurity
    name: "ESET WeLiveSecurity"
    type: rss
    url: "https://www.welivesecurity.com/en/rss/feed/"
    trust_level: 2
    lang: en
    region: global

  - id: trendmicro_research
    name: "Trend Micro Research"
    type: rss
    url: "https://www.trendmicro.com/en_us/research/rss.xml"
    trust_level: 2
    lang: en
    region: global

  # ---- 国内報道 ----
  - id: scan_netsecurity
    name: "ScanNetSecurity"
    type: rss
    url: "https://scan.netsecurity.ne.jp/rss/index.rdf"
    trust_level: 3
    lang: ja
    region: jp